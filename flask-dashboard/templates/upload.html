{% extends "base.html" %}

{% block content %}

<div class="premium-container">

    <!-- LEFT SIDE -->
    <div class="premium-left">
        <h1>🧠 Memory Forensics</h1>
        <p>Next-gen malware detection powered by RAM analysis</p>

        <div class="features">
            <div>🔍 Process Analysis</div>
            <div>🌐 Network Monitoring</div>
            <div>🧬 Malware Detection</div>
        </div>
    </div>

    <!-- RIGHT SIDE -->
    <div class="premium-card">

        <h2>📂 Create Case</h2>
        <p class="subtitle">Secure forensic upload</p>

        <form method="POST" enctype="multipart/form-data">

            <div class="input-group">
                <span>📁</span>
                <input type="text" name="case_name" placeholder="Case Name" required>
            </div>

            <div class="input-group">
                <span>👤</span>
                <input type="text" name="user_name" placeholder="User Name" required>
            </div>

            <div class="input-group">
                <span>🆔</span>
                <input type="text" name="case_id" placeholder="Case ID" required>
            </div>

            <div class="input-group">
                <span>🔐</span>
                <input type="text" name="dump_hash" placeholder="Dump Hash" required>
            </div>

            <input type="file" name="file" required>

            <button type="submit">🚀 Analyze Now</button>

        </form>

        <p class="footer-text">🔒 End-to-end encrypted analysis</p>

    </div>

</div>

{% endblock %}
